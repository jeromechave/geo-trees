# Dependabot: GitHub opens a pull request when a dependency has an update, so it is
# checked (GitHub Actions) and reviewed before being merged. Nothing is updated
# without a merge. Minor and patch updates are grouped into one pull request a week.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # wait a week after a release before proposing it (newly published versions
    # are the most likely to be withdrawn or compromised)
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
